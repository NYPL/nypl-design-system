# This workflow will publish to npm, then tag and create a GitHub release.
name: Production Release

# Runs on any push to the release branch.
on:
  push:
    branches: [release]

jobs:
  tag_and_release:
    name: Tag and Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Extract the first changelog entry (from the first ## heading up to,
      # but not including, the next ## heading) to use as the release notes.
      - name: Get release notes
        run: |
          release_notes=$(awk '/^## /{i++} i==1{print}' CHANGELOG.md)
          {
            echo "release_notes<<EOF"
            echo "$release_notes"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # Create a tag matching the package.json version (e.g. v1.0.0).
      - name: Tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v$VERSION"

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes "$release_notes" \
            --verify-tag

  publish_to_npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Cache and install node modules
        uses: bahmutov/npm-install@v1

      - name: Publish
        run: npm publish --access public --provenance
