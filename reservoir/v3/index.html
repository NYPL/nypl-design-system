<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>storybook - Storybook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    
    <style>
      @font-face {
        font-family: 'Nunito Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-regular.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-italic.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-bold.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: italic;
        font-weight: 700;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-bold-italic.woff2') format('woff2');
      }
    </style>

    <link href="./sb-manager/runtime.js" rel="modulepreload" />

    
    <link href="./sb-addons/storybook-core-server-presets-0/common-manager-bundle.js" rel="modulepreload" />
    
    <link href="./sb-addons/a11y-1/manager-bundle.js" rel="modulepreload" />
    
    <link href="./sb-addons/designs-2/register-panel-bundle.js" rel="modulepreload" />
    
    <link href="./sb-addons/links-3/manager-bundle.js" rel="modulepreload" />
    
    <link href="./sb-addons/docs-4/manager-bundle.js" rel="modulepreload" />
    
    <link href="./sb-addons/jest-5/manager-bundle.js" rel="modulepreload" />
    
    <link href="./sb-addons/storybook-6/manager-bundle.js" rel="modulepreload" />
      <!-- General Storybook additional styles -->

<style>
  [id$="_hidden"] {
    display: none !important;
  }

  .sidebar-header img {
    height: 72px;
    width: 128px;
  }

  .sidebar-subheading {
    color: #000 !important;
    font-weight: 700 !important;
    letter-spacing: 0.05em !important;
  }
  .docblock-argstable-body select:focus {
    border: 1px solid var(--nypl-colors-ui-gray-medium);
  }
</style>

<link rel="shortcut icon" href="favicon.ico" />
<link rel="icon" type="image/png" href="favicon.png" sizes="192x192" />
 

    <style>
      #storybook-root[hidden] {
        display: none !important;
      }
    </style>

    
  </head>
  <body>
    <div id="root"></div>

    
    <script>
      
        
          window['FEATURES'] = {
  "argTypeTargetsV7": true,
  "legacyDecoratorFileOrder": false,
  "disallowImplicitActionsInRenderV8": true,
  "viewport": true,
  "highlight": true,
  "controls": true,
  "interactions": true,
  "actions": true,
  "backgrounds": true,
  "outline": true,
  "measure": true
};
        
      
        
          window['REFS'] = {};
        
      
        
          window['LOGLEVEL'] = "info";
        
      
        
          window['DOCS_OPTIONS'] = {
  "defaultName": "Docs"
};
        
      
        
          window['CONFIG_TYPE'] = "PRODUCTION";
        
      
        
      
        
      
        
          window['TAGS_OPTIONS'] = {
  "dev-only": {
    "excludeFromDocsStories": true
  },
  "docs-only": {
    "excludeFromSidebar": true
  },
  "test-only": {
    "excludeFromSidebar": true,
    "excludeFromDocsStories": true
  }
};
        
      
        
          window['STORYBOOK_RENDERER'] = "react";
        
      
        
          window['STORYBOOK_BUILDER'] = "@storybook/builder-vite";
        
      
        
          window['STORYBOOK_FRAMEWORK'] = "@storybook/react-vite";
        
      
    </script>
    

    <script type="module">
      import './sb-manager/globals-runtime.js';

      
        import './sb-addons/storybook-core-server-presets-0/common-manager-bundle.js';
      
        import './sb-addons/a11y-1/manager-bundle.js';
      
        import './sb-addons/designs-2/register-panel-bundle.js';
      
        import './sb-addons/links-3/manager-bundle.js';
      
        import './sb-addons/docs-4/manager-bundle.js';
      
        import './sb-addons/jest-5/manager-bundle.js';
      
        import './sb-addons/storybook-6/manager-bundle.js';
      

      import './sb-manager/runtime.js';
    </script>
  </body>
</html>
